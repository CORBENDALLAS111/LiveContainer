name: LiveContainer OS - Integrated IPA
on:
  workflow_dispatch:
    inputs:
      build_runner:
        description: 'Standard macOS runner image'
        type: choice
        options: [macos-latest, macos-15]
        default: macos-latest
      sidestore_run_id:
        description: 'Optional existing run with matching source-built SideStore artifact'
        type: string
        default: ''
  push:
    branches: ['codex/**']
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  sidestore:
    if: ${{ !inputs.sidestore_run_id }}
    uses: ./.github/workflows/build-sidestore-source.yml
  build:
    needs: sidestore
    if: ${{ !cancelled() && (needs.sidestore.result == 'success' || inputs.sidestore_run_id != '') }}
    runs-on: ${{ inputs.build_runner || 'macos-latest' }}
    timeout-minutes: 45
    env:
      scheme: LiveContainer
      archive_path: archive
      SIDESTORE_SHA256: f9d2d9af51285dcbdece08c51aadc02e8a2d756da6ca8dfca16724c801ae2fcd
      DYLIBIFY_SHA256: 6d23f6a2fc4d8442f87caa1161aebe6ecaafd0e8c41ce205da007efb04fc82c7
      SIDESTORE_BUILD_RUN: ${{ inputs.sidestore_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - uses: actions/download-artifact@v4
        with:
          name: sidestore-source-build
          path: artifacts/sidestore-source
          run-id: ${{ env.SIDESTORE_BUILD_RUN }}
          github-token: ${{ github.token }}
      - name: Verify source-built SideStore matches this checkout
        run: python3 scripts/verify_sidestore_source.py artifacts/sidestore-source/SIDESTORE_SOURCE.json
      - name: Test package core
        run: |
          set -o pipefail
          python3 -m unittest discover -s Tests -p test_merge_app_intents.py
          swift test 2>&1 | tee package-tests.log
      - name: Archive using upstream configuration
        run: |
          set -o pipefail
          xcodebuild archive -project LiveContainer.xcodeproj -scheme "$scheme" -archivePath "$archive_path" -sdk iphoneos -arch arm64 -configuration Release 2>&1 | tee xcodebuild.log
      - name: Compile controlled device probe
        run: python3 scripts/build_device_probe.py
      - name: Validate actual SDK-built rootful and rootless packages
        run: |
          set -o pipefail
          LCOS_DEVICE_PROBE_DIR="$PWD/artifacts/device-probe" swift test --filter 'testActualDevice' 2>&1 | tee device-probe-tests.log
      - name: Validate shared SideStore signing bridge
        run: |
          set -o pipefail
          python3 scripts/test_signing_bridge.py 2>&1 | tee signing-bridge-tests.log
      - name: Package using upstream SideStore integration
        env:
          SIDESTORE_IPA_PATH: ${{ github.workspace }}/artifacts/sidestore-source/SideStore.ipa
        run: bash .github/build_github.sh
      - name: Verify integrated IPA and record provenance
        run: |
          mv LiveContainer+SideStore.ipa LiveContainerOS+SideStore.ipa
          mv LiveContainer.ipa LiveContainerOS-Standalone.ipa
          python3 scripts/verify_ipa.py LiveContainerOS+SideStore.ipa --integrated --signing-injection --automations --source-commit "$GITHUB_SHA" --output build-evidence.json
          shasum -a 256 LiveContainerOS+SideStore.ipa LiveContainerOS-Standalone.ipa > SHA256SUMS
          git rev-parse HEAD > SOURCE_COMMIT
          git submodule status > SUBMODULES
          printenv SIDESTORE_BUILD_RUN > SIDESTORE_BUILD_RUN
      - uses: actions/upload-artifact@v4
        with:
          name: LiveContainerOS+SideStore.ipa
          path: |
            LiveContainerOS+SideStore.ipa
            SHA256SUMS
            SOURCE_COMMIT
            SUBMODULES
            SIDESTORE_BUILD_RUN
            build-evidence.json
            artifacts/signing-bridge/signing-bridge-evidence.json
            artifacts/sidestore-source/SIDESTORE_SOURCE.json
            artifacts/device-probe/LCOSProbe.ipa
            artifacts/device-probe/LCOSProbe-rootful.deb
            artifacts/device-probe/LCOSProbe-rootless.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            xcodebuild.log
            package-tests.log
            device-probe-tests.log
            signing-bridge-tests.log
          if-no-files-found: warn
