name: Automations - Native Runner Tests
on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths: ['LiveContainer/LCOSAppIntents.swift', 'LiveContainerSwiftUI/Automation/**', 'TweakLoader/LCOSAutomation.*', 'TweakLoader/LCOSTouch.h', 'TweakLoader/LCOSRecorder.h', 'Tests/AutomationPreview/**', 'scripts/test_automation_simulator.py', '.github/workflows/automation-preview.yml']
permissions:
  contents: read
jobs:
  runner:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Exercise real touches, SwiftUI and record/replay
        run: python3 scripts/test_automation_simulator.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-automation-tests
          path: artifacts/automation-preview/
